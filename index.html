<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>معادلات الاضمحلال الإشعاعي 2-10</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Noto+Kufi+Arabic:wght@600;700;800&display=swap">
<style>
html,body{direction:rtl}
/* =========================================================
   الدرس 1-1 الكهرباء الساكنة — منصة تفاعلية
   التخطيط: شاشة واحدة متعددة الصفحات (SPA)، شريط علوي للتقدم،
   شريط تنقل ثابت في الأسفل، وتذييل حقوق ثابت.
   الألوان: حبر ليلي + لون "شرارة" تركوازي، والشحنة الموجبة
   بالأحمر الدافئ والسالبة بالأزرق (لغة بصرية خاصة بالموضوع).
   ========================================================= */
:root{
  --bg:#EDF1F6; --surface:#FFFFFF; --surface-2:#F5F7FB; --line:#D6DDE8;
  --fg:#131A2A; --muted:#566079; --accent:#087F91; --accent-soft:#D7F0F3;
  --pos:#D2452A; --pos-soft:#FBE3DD; --neg:#2659C9; --neg-soft:#DEE7FA;
  --ok:#1E8A4C; --ok-soft:#DDF2E5; --bad:#C2352B; --bad-soft:#F9E0DE;
  --term:#8A9A1F; --term-soft:#EFF3D2;
  --shadow:0 1px 2px rgba(19,26,42,.06),0 8px 24px rgba(19,26,42,.07);
  --on-photo:#FFFFFF;
  --f-display:"Noto Kufi Arabic","IBM Plex Sans Arabic",Tahoma,sans-serif;
  --f-body:"IBM Plex Sans Arabic","Segoe UI",Tahoma,sans-serif;
  --r:14px;
  --nav-h:94px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0C111B; --surface:#141B29; --surface-2:#1A2333; --line:#2A3448;
  --fg:#E8EDF6; --muted:#9BA6BD; --accent:#3CCBDC; --accent-soft:#123A42;
  --pos:#FF7A5C; --pos-soft:#3C1E18; --neg:#6E9BFF; --neg-soft:#18264A;
  --ok:#4CCB7F; --ok-soft:#14321F; --bad:#FF6D62; --bad-soft:#3A1715;
  --term:#C4D44E; --term-soft:#2A2F12;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px rgba(0,0,0,.35);
  color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0C111B; --surface:#141B29; --surface-2:#1A2333; --line:#2A3448;
  --fg:#E8EDF6; --muted:#9BA6BD; --accent:#3CCBDC; --accent-soft:#123A42;
  --pos:#FF7A5C; --pos-soft:#3C1E18; --neg:#6E9BFF; --neg-soft:#18264A;
  --ok:#4CCB7F; --ok-soft:#14321F; --bad:#FF6D62; --bad-soft:#3A1715;
  --term:#C4D44E; --term-soft:#2A2F12;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px rgba(0,0,0,.35);
  color-scheme:dark;}

*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:17px;line-height:1.85;
  padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px));-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--surface)}
h1,h2,h3,h4{font-family:var(--f-display);line-height:1.5;text-wrap:balance;margin:0}
p{margin:0}
button{font-family:inherit;font-size:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}
img{max-width:100%}
.wrap{max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.prose{max-width:68ch}
.muted{color:var(--muted)}
.en{font-family:var(--f-body);direction:ltr;unicode-bidi:isolate;font-weight:600}

/* ---------- الشريط العلوي ---------- */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:var(--surface);border-bottom:1px solid var(--line)}
.topbar .wrap{display:flex;align-items:center;gap:12px;padding-block:10px}
.badge{font-family:var(--f-display);font-weight:800;font-size:.85rem;background:var(--fg);color:var(--bg);border-radius:8px;padding:2px 10px;letter-spacing:.02em}
.crumb{flex:1;min-width:0;font-weight:600;font-size:.95rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crumb small{color:var(--muted);font-weight:500}
.prog{display:flex;align-items:center;gap:8px;font-size:.8rem;color:var(--muted);font-variant-numeric:tabular-nums}
.prog .bar{width:96px;height:7px;border-radius:9px;background:var(--surface-2);border:1px solid var(--line);overflow:hidden}
.prog .bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .5s}
.iconbtn{border:1px solid var(--line);background:var(--surface-2);border-radius:10px;width:38px;height:38px;display:grid;place-items:center;cursor:pointer}
.iconbtn svg{width:20px;height:20px}
@media (max-width:560px){.prog .bar{width:56px}.crumb small{display:none}}

/* ---------- الشريط السفلي الثابت ---------- */
.dock{position:fixed;inset:auto 0 0 0;z-index:55;background:var(--surface);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom,0px);box-shadow:0 -6px 20px rgba(0,0,0,.06)}
.dock .wrap{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;padding-block:8px 4px;align-items:center}
.navbtn{display:flex;align-items:center;gap:8px;justify-content:center;border:1px solid var(--line);background:var(--surface-2);
  border-radius:12px;padding:9px 14px;font-weight:700;cursor:pointer;min-height:46px;transition:background .2s,transform .15s}
.navbtn:hover{background:var(--accent-soft)}
.navbtn:active{transform:scale(.97)}
.navbtn[disabled]{opacity:.4;cursor:not-allowed}
.navbtn svg{width:20px;height:20px;flex:none}
.navbtn.home{background:var(--accent);color:#fff;border-color:transparent;padding-inline:20px}
:root[data-theme="dark"] .navbtn.home{color:#06222A}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .navbtn.home{color:#06222A}}
.navbtn .lbl{white-space:nowrap}
.credit{text-align:center;font-size:.72rem;color:var(--muted);padding:2px 0 6px;direction:rtl}
.credit span{direction:ltr;unicode-bidi:isolate;font-weight:600;color:var(--fg)}
@media (max-width:420px){.navbtn .lbl{font-size:.9rem}.navbtn{padding:8px 10px}}

/* ---------- حركة الصفحات ---------- */
#view{padding-block:22px 34px}
.page-in{animation:pageIn .42s cubic-bezier(.2,.7,.2,1)}
@keyframes pageIn{from{opacity:.0;transform:translateY(10px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- عناوين الصفحات ---------- */
.phead{display:flex;flex-direction:column;gap:6px;margin-bottom:22px}
.eyebrow{font-size:.8rem;font-weight:700;color:var(--accent);letter-spacing:.04em}
.phead h1{font-size:clamp(1.5rem,3.6vw,2.2rem);font-weight:800}
.phead p{color:var(--muted);max-width:62ch}

/* ---------- الصفحة الرئيسية ---------- */
.hero{position:relative;border-radius:22px;overflow:hidden;min-height:300px;display:flex;align-items:flex-end;box-shadow:var(--shadow);isolation:isolate}
.hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 62%;z-index:-2}
.hero::after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(0deg,rgba(6,9,18,.92) 0%,rgba(6,9,18,.55) 45%,rgba(6,9,18,.05) 100%)}
.hero .in{padding:26px clamp(18px,4vw,36px);color:var(--on-photo);display:flex;flex-direction:column;gap:8px}
.hero .unit{font-size:.9rem;opacity:.85;font-weight:600}
.hero h1{font-size:clamp(2rem,6vw,3.4rem);font-weight:800;line-height:1.25}
.hero h1 b{color:#7FE6F2}
.hero .covers{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.hero .covers span{font-size:.78rem;border:1px solid rgba(255,255,255,.3);border-radius:99px;padding:2px 10px;background:rgba(255,255,255,.08)}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-top:22px}
@media (max-width:900px){.tiles{grid-template-columns:repeat(2,1fr)}}
@media (max-width:440px){.tiles{gap:10px}}
.tile{position:relative;text-align:start;border:1px solid var(--line);background:var(--surface);border-radius:18px;padding:20px 18px 16px;cursor:pointer;
  display:flex;flex-direction:column;gap:10px;box-shadow:var(--shadow);transition:transform .25s,border-color .25s,box-shadow .25s;overflow:hidden;min-width:0}
.tile:hover{transform:translateY(-4px);border-color:var(--accent)}
.tile .ic{width:58px;height:58px;border-radius:16px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent)}
.tile .ic svg{width:32px;height:32px}
.tile h3{font-size:1.12rem;font-weight:800}
.tile p{font-size:.86rem;color:var(--muted);line-height:1.6}
.tile .meter{height:5px;border-radius:9px;background:var(--surface-2);overflow:hidden;margin-top:auto}
.tile .meter i{display:block;height:100%;background:var(--accent);width:0;transition:width .6s}
.tile .cnt{font-size:.75rem;color:var(--muted);font-variant-numeric:tabular-nums}
.tile.big .ic{width:64px;height:64px}
.tile .done{position:absolute;top:12px;left:12px;width:24px;height:24px;border-radius:50%;background:var(--ok);color:#fff;display:none;place-items:center}
.tile.visited .done{display:grid}
.tile .done svg{width:14px;height:14px}
.sparks{position:absolute;inset:0;pointer-events:none;z-index:-1}

/* شبكة القوائم الفرعية */
.subgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.subgrid .tile{padding:16px}
.subgrid .tile .ic{width:46px;height:46px;border-radius:12px}
.subgrid .tile .ic svg{width:26px;height:26px}
.tile.kind-goal .ic{background:var(--term-soft);color:var(--term)}
.tile.kind-q .ic{background:var(--pos-soft);color:var(--pos)}
.tile.kind-sum .ic{background:var(--neg-soft);color:var(--neg)}

/* ---------- عناصر عامة ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;box-shadow:var(--shadow)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.grid2>*{min-width:0}
@media (max-width:780px){.grid2{grid-template-columns:1fr}}
.stack{display:flex;flex-direction:column;gap:16px}
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface-2);border-radius:11px;padding:8px 16px;font-weight:700;cursor:pointer;transition:background .2s,transform .15s}
.btn:hover{background:var(--accent-soft)}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--accent);border-color:transparent;color:#fff}
:root[data-theme="dark"] .btn.primary{color:#06222A}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn.primary{color:#06222A}}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn svg{width:18px;height:18px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.pill{display:inline-block;font-size:.78rem;font-weight:700;border-radius:99px;padding:1px 10px;background:var(--surface-2);border:1px solid var(--line)}
.pos{color:var(--pos)} .neg{color:var(--neg)}

/* صندوق المصطلحات العلمية (على طريقة الكتاب) */
.term{border-radius:var(--r);overflow:hidden;border:1px solid var(--term);background:var(--term-soft)}
.term .th{display:flex;align-items:center;gap:8px;background:var(--term);color:#fff;font-family:var(--f-display);font-weight:700;padding:6px 14px;font-size:.95rem}
:root[data-theme="dark"] .term .th{color:#1d2105}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .term .th{color:#1d2105}}
.term .th svg{width:18px;height:18px}
.term .tb{padding:12px 16px}
.term b{font-weight:700}
.remember{border-inline-start:5px solid var(--accent);background:var(--accent-soft);border-radius:10px;padding:12px 16px}

/* شكل الكتاب مع إمكانية التكبير */
figure{margin:0}
.fig{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:10px;position:relative;cursor:zoom-in}
.fig img{display:block;margin:auto;border-radius:6px}
.fig .zoomhint{position:absolute;top:10px;left:10px;background:rgba(19,26,42,.75);color:#fff;border-radius:8px;padding:3px 8px;font-size:.72rem;display:flex;gap:4px;align-items:center}
.fig .zoomhint svg{width:14px;height:14px}
figcaption{font-size:.86rem;color:var(--muted);margin-top:8px;line-height:1.7}
figcaption b{color:var(--fg)}

/* صور توضيحية واقعية */
.photo .ph{position:relative;border-radius:var(--r);overflow:hidden;cursor:zoom-in;box-shadow:var(--shadow);background:#111}
.photo img{display:block;width:100%;height:auto;aspect-ratio:8/5;object-fit:cover;transition:transform .6s}
.photo .ph:hover img{transform:scale(1.03)}
.phtag{position:absolute;bottom:8px;left:8px;background:rgba(10,14,24,.7);color:#fff;font-size:.7rem;border-radius:7px;padding:2px 8px}
.photostrip{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:18px}
.photostrip>*{min-width:0}
@media (max-width:640px){.photostrip{grid-template-columns:1fr}}
/* ---------- الأهداف ---------- */
.goals{display:flex;flex-direction:column;gap:18px}
.goal{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:start}
.goal .num{font-family:var(--f-display);font-weight:800;font-size:1.25rem;background:var(--fg);color:var(--bg);border-radius:12px;padding:6px 12px;direction:ltr;font-variant-numeric:tabular-nums}
.goal .txt{font-size:1.15rem;font-weight:700;padding-top:4px}
.goal ul{margin:10px 0 0;padding:0;list-style:none}
.goal li{position:relative;padding-inline-start:22px;font-weight:500;color:var(--fg)}
.goal li::before{content:"";position:absolute;inset-inline-start:4px;top:.75em;width:9px;height:9px;border-radius:50%;background:var(--accent)}

/* ---------- الخط الزمني (فرانكلين) ---------- */
.banner{border-radius:18px;overflow:hidden;position:relative;height:200px;margin-bottom:18px}
.banner img{width:100%;height:100%;object-fit:cover;object-position:center 30%;display:block}
.banner::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(6,9,18,.1),rgba(6,9,18,.75))}
.banner .cap{position:absolute;inset:auto 18px 14px auto;color:#fff;z-index:1;font-family:var(--f-display);font-weight:800;font-size:1.3rem;max-width:70%}
.tl{display:grid;grid-template-columns:240px 1fr;gap:18px}
.tl>*{min-width:0}
@media (max-width:760px){.tl{grid-template-columns:1fr}}
.tl-steps{display:flex;flex-direction:column;gap:8px;position:relative}
.tl-step{display:flex;gap:12px;align-items:center;text-align:start;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 12px;cursor:pointer;font-weight:700;transition:all .2s}
.tl-step .dot{width:30px;height:30px;border-radius:50%;flex:none;display:grid;place-items:center;background:var(--surface-2);border:2px solid var(--line);font-size:.8rem;font-variant-numeric:tabular-nums}
.tl-step[aria-selected="true"]{border-color:var(--accent);background:var(--accent-soft)}
.tl-step[aria-selected="true"] .dot{background:var(--accent);border-color:var(--accent);color:#fff}
.tl-step.seen .dot{border-color:var(--accent)}
.tl-pane{min-height:220px}
.tl-pane h3{font-size:1.2rem;margin-bottom:8px}
.yr{font-family:var(--f-display);font-weight:800;font-size:2.4rem;color:var(--accent);line-height:1;font-variant-numeric:tabular-nums}

/* ---------- بطاقات المواقف ---------- */
.flipgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.flip{perspective:900px;min-height:220px;cursor:pointer;border:0;background:none;padding:0;text-align:start}
.flip .inner{position:relative;width:100%;height:100%;min-height:220px;transition:transform .6s;transform-style:preserve-3d}
.flip.on .inner{transform:rotateY(180deg)}
.flip .face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:10px;border:1px solid var(--line);background:var(--surface);box-shadow:var(--shadow)}
.flip .back{transform:rotateY(180deg);background:var(--accent-soft);border-color:var(--accent);font-size:.93rem;line-height:1.75;overflow:auto}
.flip .face .ico{width:48px;height:48px;border-radius:12px;background:var(--surface-2);display:grid;place-items:center;color:var(--accent)}
.flip .face .ico svg{width:28px;height:28px}
.flip h4{font-size:1.02rem}
.flip .hint{margin-top:auto;font-size:.78rem;color:var(--muted);display:flex;gap:6px;align-items:center}
.flip .hint svg{width:14px;height:14px}

/* ---------- تبويبات الشكل 1-1 ---------- */
.tabs{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.tab{border:1px solid var(--line);background:var(--surface-2);border-radius:99px;padding:6px 16px;font-weight:700;cursor:pointer}
.tab[aria-selected="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.halfwrap{overflow:hidden;border-radius:8px;position:relative;aspect-ratio:437/550;max-width:100%;margin:auto;max-height:420px}
.halfwrap img{position:absolute;top:0;height:100%;width:auto;max-width:none;transition:right .5s,left .5s}
.steps{counter-reset:s;list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.steps li{counter-increment:s;display:grid;grid-template-columns:34px 1fr;gap:10px;align-items:start;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--surface);transition:all .3s}
.steps li::before{content:counter(s);font-family:var(--f-display);font-weight:800;width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:var(--surface-2);font-size:.9rem}
.steps li.hl{border-color:var(--accent);background:var(--accent-soft)}
.steps li.hl::before{background:var(--accent);color:#fff}
.verdict{display:flex;gap:10px;align-items:center;font-family:var(--f-display);font-weight:800;font-size:1.15rem;padding:10px 14px;border-radius:12px}
.verdict svg{width:26px;height:26px;flex:none}
.verdict.att{background:var(--ok-soft);color:var(--ok)}
.verdict.rep{background:var(--bad-soft);color:var(--bad)}

/* ---------- الشحنات ---------- */
.chg-duo{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.chg{border-radius:18px;padding:22px;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;border:1px solid var(--line)}
.chg .sym{width:86px;height:86px;border-radius:50%;display:grid;place-items:center;font-size:3rem;font-weight:800;color:#fff;font-family:var(--f-body);line-height:1;box-shadow:0 0 0 8px rgba(0,0,0,.04)}
.chg.p{background:var(--pos-soft)} .chg.p .sym{background:var(--pos)}
.chg.n{background:var(--neg-soft)} .chg.n .sym{background:var(--neg)}
.chg h3{font-size:1.15rem}
svg text{font-family:var(--f-body)}
.svgbox{background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.svgbox svg{display:block;width:100%;height:auto}
.s-pos{fill:var(--pos)} .s-neg{fill:var(--neg)} .s-fg{fill:var(--fg)} .s-muted{fill:var(--muted)}
.s-surface{fill:var(--surface)} .s-line{stroke:var(--line)} .s-acc{fill:var(--accent)}

/* القواعد */
.rules{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:640px){.rules,.chg-duo{grid-template-columns:1fr}}
.rule{border-radius:18px;padding:18px;border:2px solid var(--line);background:var(--surface);display:flex;flex-direction:column;gap:10px;align-items:center;text-align:center}
.rule.rep{border-color:var(--bad)} .rule.att{border-color:var(--ok)}
.rule h3{font-size:1.2rem}
.rule.rep h3{color:var(--bad)} .rule.att h3{color:var(--ok)}
.pairsel{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.pairsel button{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:6px 14px;cursor:pointer;font-weight:800;font-size:1.05rem;direction:ltr}
.pairsel button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}

/* مقارنة */
.vs{display:grid;grid-template-columns:1fr auto 1fr;gap:14px;align-items:stretch}
.vs>*{min-width:0}
.vs .mid{display:grid;place-items:center;font-family:var(--f-display);font-weight:800;color:var(--muted)}
@media (max-width:640px){.vs{grid-template-columns:1fr}.vs .mid{padding:2px}}

/* ---------- الخلاصة ---------- */

/* ---------- المختبرات ---------- */
.labbar{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}

.feedback.good{background:var(--ok-soft);border-color:var(--ok);color:var(--fg)}

.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}

/* ---------- الألعاب ---------- */
.gamehud{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:12px}

.race .pair{display:flex;gap:28px;justify-content:center}

.flash-ok{animation:fok .5s} .flash-bad{animation:fbad .5s}

.bins{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}

.mcard{aspect-ratio:3/3.4;perspective:700px;border:0;background:none;padding:0;cursor:pointer;max-width:100%}

.order{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}

/* ---------- عارض التكبير ---------- */
.lb{position:fixed;inset:0;z-index:100;background:rgba(5,8,14,.92);display:flex;flex-direction:column}

b.pos{color:var(--pos)} b.neg{color:var(--neg)}

/* ---------- GSAP: شريط القراءة، أكمل الفراغ ---------- */

svg{-webkit-user-select:none;user-select:none}

.flowrow{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:center}

.ohm label{display:flex;flex-direction:column;gap:4px;font-weight:700}.ohm input{width:130px;padding:8px;border-radius:10px;border:1px solid var(--line);background:var(--surface-2);color:var(--fg);font-size:1rem}

label select,label input[type=number]{padding:6px 8px;border-radius:9px;border:1px solid var(--line);background:var(--surface-2);color:var(--fg);font-size:1rem;width:90px;margin:0 4px}

.cmp2{display:grid;grid-template-columns:1fr 1fr;gap:12px;text-align:center}

.exsteps{display:flex;flex-direction:column;gap:12px}.exstep{border-inline-start:4px solid #F07D1A;background:var(--surface-2);border-radius:10px;padding:12px 14px}
.exn{display:inline-block;background:#F07D1A;color:#fff;font-weight:800;border-radius:8px;padding:1px 10px;margin-bottom:6px}
.dangerbox{border:2px solid var(--bad);background:var(--bad-soft);border-radius:14px;padding:14px 16px}
.dangerbox .dh{display:flex;gap:8px;align-items:center;color:var(--bad);margin-bottom:6px;font-size:1.05rem}.dangerbox .dh svg{width:22px;height:22px}
ul.dots{margin:6px 0 0;padding-inline-start:22px;font-weight:600}
.ammeter{border:2px solid var(--line);border-radius:14px;padding:12px;background:var(--surface);text-align:center}
.ammeter>span{font-size:2rem;font-weight:800;display:block}
.ammeter .scale{position:relative;height:16px;border-radius:9px;background:var(--surface-2);overflow:visible;margin-top:22px}
.ammeter .scale i{display:block;height:100%;border-radius:9px;transition:width .2s}
.ammeter .scale b{position:absolute;top:-22px;font-size:.8rem;color:var(--bad);transform:translateX(50%)}
.ammeter .scale b::after{content:"";position:absolute;left:50%;top:18px;width:2px;height:20px;background:var(--bad)}
.beat{transform-origin:150px 160px;animation:beat .5s infinite}@keyframes beat{50%{transform:scale(1.15)}}
.simplebox{border:2px dashed var(--accent);background:var(--accent-soft);border-radius:14px;padding:12px 16px}
.simplebox .sh{display:flex;gap:8px;align-items:center;color:var(--accent);font-size:1.05rem}.simplebox .sh svg{width:22px;height:22px}
.simplebox ul{margin:6px 0 0;padding-inline-start:22px;display:flex;flex-direction:column;gap:4px;font-weight:600;font-size:1.05rem}
.partpick,.devpick{display:flex;gap:8px;flex-wrap:wrap}
.partpick button{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 14px;font-weight:700;cursor:pointer}
.partpick button.right{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.fusepick{display:flex;gap:10px;flex-wrap:wrap;margin:10px 0}.fusepick button{border:2px solid var(--line);background:#fff;border-radius:12px;padding:4px;cursor:pointer}
.fusepick button.sel{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.labboard{display:grid;grid-template-columns:1fr 1fr;gap:16px}.labboard>*{min-width:0}@media (max-width:780px){.labboard{grid-template-columns:1fr}}
.devpick button{display:flex;flex-direction:column;align-items:center;gap:2px;border:2px solid var(--line);background:#fff;border-radius:14px;padding:8px;cursor:pointer;min-width:96px;color:#131A2A}
.devpick button.sel{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}.devpick small{color:#566079}
.bench{display:flex;flex-direction:column;align-items:center;gap:8px;background:linear-gradient(#f3f5f8,#e2e6eb);border-radius:14px;padding:14px;width:100%}
.benchdev{transition:filter .3s}.benchdev.run{filter:drop-shadow(0 0 12px #ffd84a)}.benchdev.run .coil{fill:#ff6a2a}
.benchdev.hot,.hot>svg{filter:drop-shadow(0 0 14px #e8463c) saturate(1.4)}
.lblwrap{position:relative;max-width:100%;cursor:crosshair}.lblwrap img{display:block;width:100%;border-radius:8px;border:1px solid var(--line)}
.lblwrap .hot{position:absolute;border-radius:6px;cursor:pointer}.lblwrap .hot.found{outline:3px solid var(--ok);background:rgba(30,138,76,.15)}
.stepper3{display:flex;flex-direction:column;gap:10px}.stepper3 .st{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start;padding:10px;border-radius:12px;background:var(--surface-2);transition:opacity .3s}
.stepper3 .st.dim{opacity:.45}.stepper3 input{width:110px;padding:8px;border-radius:9px;border:1px solid var(--line);background:var(--surface);color:var(--fg);font-size:1rem}
.plugbox{position:relative;max-width:320px;width:100%;cursor:pointer}.plugbox .slot{position:absolute;left:34.5%;top:57%;width:37%;pointer-events:none}
.fusetray{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}.tfuse{border:2px solid var(--line);background:#fff;border-radius:12px;padding:2px;cursor:grab}.tfuse.sel{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.shelf{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:12px;background:linear-gradient(#c9a77a,#a8855a);padding:10px;border-radius:14px}
@media (max-width:640px){.shelf{grid-template-columns:repeat(2,1fr)}}
.sbin{background:#fff;border-radius:12px;padding:6px;min-height:150px;display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;border:2px dashed transparent}
.sbin.over{border-color:var(--accent)}.sitems{display:flex;flex-direction:column;gap:4px;width:100%}.sitems .dchip{font-size:.8rem;padding:4px 6px;color:#131A2A}
.predcard{display:flex;gap:16px;align-items:center;justify-content:center;flex-wrap:wrap;background:linear-gradient(#f3f5f8,#e2e6eb);border-radius:14px;padding:14px;color:#131A2A}
.opts3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}@media (max-width:560px){.opts3{grid-template-columns:1fr}}
.opts3 button{padding:12px;border-radius:12px;border:2px solid var(--line);background:var(--surface);font-weight:800;cursor:pointer;font-family:var(--f-display)}
.opts3 button.right{border-color:var(--ok);background:var(--ok-soft);color:var(--ok)}.opts3 button.wrong{border-color:var(--bad);background:var(--bad-soft);color:var(--bad)}
.crumb b{font-weight:800}
.rtrow>span.en,.rtrow>span>.en{text-align:right;display:block}
.blank.filled{border-bottom-style:solid}
.blank.ok{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.blank.no{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
</style>
</head>

const $ = (s,r=document)=>r.querySelector(s);

const shuffle = a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('show'),2200)}
function fig(src,cap,alt,extra=''){return `<figure><div class="fig" data-zoom="${src}" data-cap="${(cap||'').replace(/<[^>]+>/g,'').replace(/"/g,'&quot;')}" ${extra}><span class="zoomhint">${I.zoom} تكبير</span><img src="${IMG[src]}" alt="${alt}"></div>${cap?`<figcaption>${cap}</figcaption>`:''}</figure>`}

/* ---------- عارض التكبير مع السحب واللمس ---------- */
const LB={s:1,x:0,y:0,base:1,pts:new Map(),pinch:0};
function lbApply(){const im=$('#lbImg');im.style.transform=`translate(calc(-50% + ${LB.x}px), calc(-50% + ${LB.y}px)) scale(${LB.s*LB.base})`}
function lbFit(){const im=$('#lbImg'),st=$('#lbStage');const w=im.naturalWidth||1,h=im.naturalHeight||1;LB.base=Math.min(st.clientWidth*.94/w,st.clientHeight*.94/h);LB.s=1;LB.x=LB.y=0;lbApply()}
function openLB(key,cap){const im=$('#lbImg');im.onload=lbFit;im.src=IMG[key];im.alt=cap||'';$('#lbCap').textContent=cap||'';$('#lb').hidden=false;document.body.style.overflow='hidden';if(im.complete)setTimeout(lbFit,0);$('#lbClose').focus()}
function closeLB(){$('#lb').hidden=true;document.body.style.overflow=''}
function lbZoom(f){LB.s=Math.min(8,Math.max(.5,LB.s*f));lbApply()}
$('#lbIn').onclick=()=>lbZoom(1.35);$('#lbOut').onclick=()=>lbZoom(1/1.35);$('#lbFit').onclick=lbFit;$('#lbClose').onclick=closeLB;

function geiger(rate,onTick){let alive=true,t=0;const loop=()=>{if(!alive)return;const dt=-Math.log(1-Math.random())/Math.max(rate,0.05)*1000;t=setTimeout(()=>{if(!alive)return;onTick();loop()},Math.min(dt,8000))};loop();return ()=>{alive=false;clearTimeout(t)}}

/* رسم نواة من بروتونات ونيوترونات داخل SVG */
function nucleusSVG(Z,N,cx,cy,r=9){const tot=Z+N;if(!tot)return '';const pts=[];let k=0;const golden=2.39996;
 for(let i=0;i<tot;i++){const rr=r*0.95*Math.sqrt(i+0.5);pts.push([cx+rr*Math.cos(i*golden),cy+rr*Math.sin(i*golden)])}
 const kinds=[];let zp=Z,nn=N;for(let i=0;i<tot;i++){const pickP=zp>0&&(nn===0||(i%2===0?zp>=nn:zp>nn));kinds.push(pickP?'p':'n');pickP?zp--:nn--}
 return pts.map((p,i)=>({p,s:kinds[i]})).reverse().map(({p,s})=>`<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="${r}" fill="${ATOMCOL[s]}" stroke="#222" stroke-width="1"/>${s==='p'?`<text x="${p[0].toFixed(1)}" y="${(p[1]+4).toFixed(1)}" text-anchor="middle" font-size="${r*1.1}" fill="#fff" font-weight="800">+</text>`:''}`).join('')}

/* =========================================================
   8) الحركات الاحترافية: GSAP + ScrollTrigger
   تحسين تدريجي: الدرس يعمل كاملاً إذا لم تُحمَّل المكتبة،
   ويحترم إعداد "تقليل الحركة" في جهاز الطالب.
   ========================================================= */
const FX_SEL='.card,.tile,.sumc,.qcard,.exam,figure,.flip,.chg,.rule,.term,.remember,.vsc';
const FX={on:false,bar:null,safe:0,
 init(){
  this.on=!!window.gsap&&!matchMedia('(prefers-reduced-motion: reduce)').matches;
  if(!this.on)return;
  if(window.ScrollTrigger)gsap.registerPlugin(ScrollTrigger);
  gsap.defaults({ease:'power3.out',duration:.6});
  /* شريط تقدّم القراءة أسفل الشريط العلوي */
  const bar=document.createElement('div');bar.className='readbar';document.querySelector('.topbar').appendChild(bar);this.bar=bar;
  /* إبراز صناديق النتائج كلما تغيّرت */
  const pending=new Set();let raf=0;
  new MutationObserver(ms=>{ms.forEach(m=>{const t=m.target.nodeType===1?m.target:m.target.parentElement;const el=t&&t.closest('.feedback,.tally,.ans,.paper.answer,.endcard');if(el)pending.add(el)});
   if(!raf)raf=requestAnimationFrame(()=>{raf=0;pending.forEach(el=>{if(el.offsetParent&&!el._fxBusy){el._fxBusy=1;gsap.fromTo(el,{scale:.96,opacity:.5},{scale:1,opacity:1,duration:.4,ease:'back.out(1.8)',onComplete:()=>{el._fxBusy=0}})}});pending.clear()})})
   .observe(document.getElementById('view'),{childList:true,subtree:true,attributes:true,attributeFilter:['hidden','class']});
  /* لمسة عند الضغط على الأزرار الرئيسية */
  document.addEventListener('pointerdown',e=>{const b=e.target.closest('.btn,.navbtn,.tile');if(b)gsap.fromTo(b,{scale:.96},{scale:1,duration:.35,ease:'back.out(3)'})});
 },
 page(){
  if(!this.on)return;
  const v=document.getElementById('view');v.classList.remove('page-in');
  if(window.ScrollTrigger)ScrollTrigger.getAll().forEach(t=>t.kill());
  clearTimeout(this.safe);
  const tl=gsap.timeline();
  const ph=v.querySelector('.phead');if(ph)tl.from(ph.children,{y:24,opacity:0,stagger:.08,duration:.5});
  const hero=v.querySelector('.hero');
  if(hero){
   tl.from(hero,{scale:.97,opacity:0,duration:.7},0).from(hero.querySelectorAll('.in > *'),{y:28,opacity:0,stagger:.12},'-=.35');
   const img=hero.querySelector('img');
   if(window.ScrollTrigger&&img)gsap.fromTo(img,{yPercent:-4,scale:1.1},{yPercent:6,scale:1.1,ease:'none',scrollTrigger:{trigger:hero,start:'top top',end:'bottom top',scrub:true}});
  }
  const items=[...v.querySelectorAll(FX_SEL)].filter(el=>!(hero&&hero.contains(el))&&!el.parentElement.closest(FX_SEL));
  if(window.ScrollTrigger){
   gsap.set(items,{opacity:0,y:30});
   ScrollTrigger.batch(items,{start:'top 94%',once:true,onEnter:b=>gsap.to(b,{opacity:1,y:0,stagger:.09,duration:.65,overwrite:true})});
   /* إذا كانت المنصة تعرض الدرس بإطار لا يتمرّر، تظهر جميع العناصر */
   this.safe=setTimeout(()=>{const doc=document.documentElement;if(doc.scrollHeight-innerHeight<10)gsap.to(items,{opacity:1,y:0,stagger:.05,duration:.45,overwrite:true})},1200);
   if(this.bar){gsap.set(this.bar,{scaleX:0});ScrollTrigger.create({start:0,end:'max',onUpdate:s=>gsap.set(this.bar,{scaleX:s.progress})})}
   ScrollTrigger.refresh();
  } else tl.from(items,{y:24,opacity:0,stagger:.05,duration:.45},'-=.2');
 },
 /* حركة شحنات متتابعة (تُستخدم في الحائط والذرّة) */
 move(els,fn,opts={}){if(!this.on)return false;els.forEach(e=>e.style.transition='none');gsap.to(els,Object.assign({x:(i,e)=>fn(e).x,y:(i,e)=>fn(e).y,duration:.9,stagger:{each:.035,from:'end'},ease:'power2.inOut',overwrite:true},opts));return true},
 pop(el){if(this.on&&el)gsap.fromTo(el,{scale:.9},{scale:1,duration:.45,ease:'back.out(2.2)'})}
};
FX.init();

/* =========================================================
   9) اتجاه نصوص الأرقام والوحدات داخل الرسوم (12 V وليس V 12)
   ========================================================= */
const LTR_RE=/^[\s\dA-Za-zΩ.,+\-−=×÷/:()₀-₉%°'⁻¹²³⁴⁵⁶⁷⁸⁹~]+$/;
function fixSvgDir(root){(root||document).querySelectorAll('svg text').forEach(t=>{const s=t.textContent.trim();if(s&&LTR_RE.test(s)){t.setAttribute('direction','ltr');t.style.unicodeBidi='plaintext'}})}
(function(){let raf=0;const v=document.getElementById('view');if(!v)return;new MutationObserver(()=>{if(!raf)raf=requestAnimationFrame(()=>{raf=0;fixSvgDir(v)})}).observe(v,{childList:true,subtree:true,characterData:true})})();

/* =========================================================
   6) الموجّه (التنقل بين الصفحات)
   ========================================================= */
/* =========================================================
   7) ربط SCORM 1.2 (يعمل فقط داخل منصة تعليمية تدعم SCORM)
   يحفظ الصفحات المزارة، ونسبة التقدم كدرجة، وحالة الإكمال.
   ========================================================= */
const SCORM={api:null,t0:Date.now(),
  find(w){let n=0;while(w&&n<10){if(w.API)return w.API;if(w.parent===w)break;w=w.parent;n++}return null},
  init(){try{this.api=this.find(window)||(window.opener&&this.find(window.opener))}catch(e){this.api=null}
    if(!this.api)return;try{this.api.LMSInitialize('');const st=this.api.LMSGetValue('cmi.core.lesson_status');
      if(st!=='completed'&&st!=='passed')this.api.LMSSetValue('cmi.core.lesson_status','incomplete');
      const sd=this.api.LMSGetValue('cmi.suspend_data');if(sd){JSON.parse(sd).forEach(v=>visited.add(v))}}catch(e){}},
  save(pct){if(!this.api)return;try{this.api.LMSSetValue('cmi.suspend_data',JSON.stringify([...visited]));
    this.api.LMSSetValue('cmi.core.score.min','0');this.api.LMSSetValue('cmi.core.score.max','100');this.api.LMSSetValue('cmi.core.score.raw',String(pct));
    if(pct>=100)this.api.LMSSetValue('cmi.core.lesson_status','completed');this.api.LMSCommit('')}catch(e){}},
  finish(){if(!this.api||this.done)return;this.done=true;try{const sec=Math.round((Date.now()-this.t0)/1000);const t=[Math.floor(sec/3600),Math.floor(sec/60)%60,sec%60].map(x=>String(x).padStart(2,'0')).join(':');
    this.api.LMSSetValue('cmi.core.session_time',t);this.api.LMSCommit('');this.api.LMSFinish('')}catch(e){}}
};
SCORM.init();
window.addEventListener('pagehide',()=>SCORM.finish());window.addEventListener('beforeunload',()=>SCORM.finish());
let current='home';const LNAME='معادلات الاضمحلال الإشعاعي';
function go(id,push=true){
  if(!P[id])id='home';
  if(cleanup){try{cleanup()}catch(e){}cleanup=null}
  current=id;visited.add(id);store.set('visited',[...visited]);
  const v=$('#view');v.innerHTML=P[id].render();v.classList.remove('page-in');void v.offsetWidth;v.classList.add('page-in');
  if(P[id].after)P[id].after();
  FX.page();
  const sec=SECTION[id];
  $('#crumb').innerHTML=id==='home'?'<b>معادلات الاضمحلال الإشعاعي</b> <small>· الصفحة الرئيسية</small>':'<b>'+LNAME+'</b> <small>· '+(sec&&sec!==id?SECNAME[sec]+' ‹ ':'')+P[id].title+'</small>';
  const i=ORDER.indexOf(id);$('#prevBtn').disabled=i<=0;$('#nextBtn').disabled=i>=ORDER.length-1;
  const pct=Math.round(visited.size/ORDER.length*100);SCORM.save(pct);$('#progbar').style.width=pct+'%';$('#progtxt').textContent=pct+'%';
  if(pct===100&&!store.get('done100',false)){store.set('done100',true);setTimeout(()=>toast('رائع! زرت جميع صفحات الدرس'),600)}
  window.scrollTo({top:0,behavior:'instant'});
  if(push){try{history.pushState({id},'',id==='home'?location.pathname:'#'+id)}catch(e){}}
  document.title=(id==='home'?'':P[id].title+' · ')+'معادلات الاضمحلال الإشعاعي 2-10';
}
document.addEventListener('click',e=>{const t=e.target.closest('[data-go]');if(t){go(t.dataset.go)}});
$('#prevBtn').onclick=()=>{const i=ORDER.indexOf(current);if(i>0)go(ORDER[i-1])};
$('#nextBtn').onclick=()=>{const i=ORDER.indexOf(current);if(i<ORDER.length-1)go(ORDER[i+1])};
$('#homeBtn').onclick=()=>go('home');
window.addEventListener('popstate',e=>go((e.state&&e.state.id)||(location.hash.slice(1))||'home',false));
go(location.hash.slice(1)||'home',false);
